# ZeroOps em Qualidade: https://tickets.pizzahut.pt -> API em 127.0.0.1:4311.
# Instalado por deploy/docker/qa-tickets-host.ps1 em /etc/apache2/sites-available/.
# A API valida a Origin contra ZEROOPS_PUBLIC_URL e emite cookies Secure; o Apache termina o TLS.
<VirtualHost *:80>
  ServerName tickets.pizzahut.pt
  Redirect permanent / https://tickets.pizzahut.pt/
</VirtualHost>

<VirtualHost *:443>
  ServerName tickets.pizzahut.pt
  ErrorLog ${APACHE_LOG_DIR}/zeroops-tickets-error.log
  CustomLog ${APACHE_LOG_DIR}/zeroops-tickets-access.log combined

  SSLEngine On
  SSLCertificateFile /etc/certs/zeroops-tickets.crt
  SSLCertificateKeyFile /etc/certs/zeroops-tickets.key

  Header always set Strict-Transport-Security "max-age=15768000"

  ProxyRequests Off
  ProxyPreserveHost On
  ProxyTimeout 120
  RequestHeader set X-Forwarded-Proto "https"
  ProxyPass / http://127.0.0.1:4311/ retry=0
  ProxyPassReverse / http://127.0.0.1:4311/
</VirtualHost>
